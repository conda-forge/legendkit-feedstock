{% set name = "legendkit" %}
{% set version = "0.5.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/legendkit-{{ version }}.tar.gz
  sha256: 69d73b52d43427127964ca9ea868a3c50bfcaf0154575c79bea9a81028fe2818

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - matplotlib-base

test:
  imports:
    - legendkit
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Marsilea-viz/legendkit
  summary: Legend creation and manipulation with ease for matplotlib
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Mr-Milk
